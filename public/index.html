<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker-MD VCF Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .glass { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(236, 72, 153, 0.2); }
        .neon-glow { box-shadow: 0 0 25px rgba(236, 72, 153, 0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Container Card -->
    <div class="max-w-md w-full glass rounded-2xl overflow-hidden neon-glow shadow-2xl">
        <!-- Banner Image -->
        <div class="relative h-56 w-full overflow-hidden">
            <img src="1000039669.jpg" alt="VCF Banner" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-[#0b0f19] via-transparent to-transparent"></div>
            <h1 class="absolute bottom-3 left-4 text-2xl font-bold text-pink-500 drop-shadow-md">VCF Hub Portal</h1>
        </div>

        <div class="p-6">
            <!-- Creator Panel / Setup Section -->
            <div id="creator-section">
                <h2 class="text-lg font-semibold mb-4 text-cyan-400">Host a New VCF List</h2>
                <form id="create-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1 text-gray-300">Choose Limit Type</label>
                        <select id="limitType" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:border-pink-500 outline-none" onchange="toggleLimitFields()">
                            <option value="time">Time Based Limit</option>
                            <option value="number">Number of People Limit</option>
                        </select>
                    </div>

                    <!-- Time Options -->
                    <div id="time-options" class="grid grid-cols-2 gap-2">
                        <input type="number" id="timeValue" placeholder="Duration value" value="24" class="bg-gray-900 border border-gray-700 rounded-lg p-3 text-white outline-none">
                        <select id="timeUnit" class="bg-gray-900 border border-gray-700 rounded-lg p-3 text-white outline-none">
                            <option value="hours">Hours</option>
                            <option value="days" selected>Days</option>
                            <option value="weeks">Weeks</option>
                            <option value="months">Months</option>
                        </select>
                    </div>

                    <!-- Number Options (Hidden by default) -->
                    <div id="number-options" class="hidden">
                        <label class="block text-sm font-medium mb-1 text-gray-300">Max Participants</label>
                        <input type="number" id="maxPeople" placeholder="e.g. 100" value="50" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white outline-none">
                    </div>

                    <button type="submit" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 font-semibold py-3 rounded-lg transition-all shadow-lg text-white">
                        Generate VCF Link & Password
                    </button>
                </form>

                <!-- Result Box -->
                <div id="result-box" class="hidden mt-6 p-4 bg-gray-900 border border-pink-500/40 rounded-xl space-y-3">
                    <p class="text-sm text-green-400 font-semibold">VCF Session Created Successfully!</p>
                    <div>
                        <span class="text-xs text-gray-400">Shareable Link:</span>
                        <input type="text" id="share-link" readonly class="w-full bg-gray-800 text-xs text-pink-300 p-2 rounded border border-gray-700 mt-1 select-all">
                    </div>
                    <div>
                        <span class="text-xs text-gray-400">Download Password:</span>
                        <p id="share-password" class="text-lg font-bold text-yellow-400 tracking-wider"></p>
                    </div>
                    <a id="visit-link" href="#" class="block text-center bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2 rounded-lg text-sm mt-2 transition">Open Participant Page</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        function toggleLimitFields() {
            const type = document.getElementById('limitType').value;
            if (type === 'time') {
                document.getElementById('time-options').classList.remove('hidden');
                document.getElementById('number-options').classList.add('hidden');
            } else {
                document.getElementById('time-options').classList.add('hidden');
                document.getElementById('number-options').classList.remove('hidden');
            }
        }

        document.getElementById('create-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const limitType = document.getElementById('limitType').value;
            let limitValue = {};

            if (limitType === 'time') {
                limitValue = {
                    value: document.getElementById('timeValue').value,
                    unit: document.getElementById('timeUnit').value
                };
            } else {
                limitValue = {
                    max: document.getElementById('maxPeople').value
                };
            }

            const response = await fetch('/api/create-session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ limitType, limitValue })
            });

            const data = await response.json();
            if (data.success) {
                const fullLink = window.location.origin + data.link;
                document.getElementById('share-link').value = fullLink;
                document.getElementById('share-password').innerText = data.password;
                document.getElementById('visit-link').href = data.link;
                document.getElementById('result-box').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
