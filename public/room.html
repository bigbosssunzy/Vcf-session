<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join VCF Contact List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .glass { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(236, 72, 153, 0.2); }
        .neon-glow { box-shadow: 0 0 25px rgba(236, 72, 153, 0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full glass rounded-2xl overflow-hidden neon-glow shadow-2xl">
        <!-- Banner Image -->
        <div class="relative h-48 w-full overflow-hidden">
            <img src="1000039669.jpg" alt="VCF Banner" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-[#0b0f19] via-transparent to-transparent"></div>
            <h1 id="status-title" class="absolute bottom-3 left-4 text-xl font-bold text-pink-500">Join VCF Contact List</h1>
        </div>

        <div class="p-6">
            <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-sm text-center font-medium"></div>

            <!-- Registration Form -->
            <form id="reg-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-300">Your Name</label>
                    <input type="text" id="name" required placeholder="e.g. Big Boss" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:border-pink-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-300">WhatsApp Number</label>
                    <input type="text" id="phone" required placeholder="+2347086057694" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:border-pink-500 outline-none">
                    <span class="text-xs text-gray-500 mt-1 block">Must start with country code (e.g. +234...)</span>
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 font-semibold py-3 rounded-lg transition-all shadow-lg text-white">
                    Add My Number
                </button>
            </form>

            <hr class="border-gray-800 my-6">

            <!-- Download Section with Password Protection -->
            <div class="space-y-3">
                <h3 class="text-sm font-semibold text-cyan-400">Download VCF File</h3>
                <div class="flex gap-2">
                    <input type="password" id="vcf-password" placeholder="Enter VCF Password" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white outline-none focus:border-cyan-500">
                    <button onclick="downloadVcf()" id="download-btn" class="bg-gray-800 border border-gray-700 text-gray-400 font-medium px-4 py-2.5 rounded-lg text-sm transition cursor-not-allowed" disabled>
                        Download
                    </button>
                </div>
                <span class="text-xs text-gray-500 block">Password is required to unlock the download button.</span>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('id');

        // Check if session is active upon loading
        async function checkSession() {
            const res = await fetch(`/api/session/${sessionId}`);
            const data = await res.json();
            if (!data.active) {
                showAlert(data.message || 'This session is inactive or closed.', 'red');
                document.getElementById('reg-form').style.display = 'none';
            }
        }
        checkSession();

        // Enable download button when password input has text
        document.getElementById('vcf-password').addEventListener('input', (e) => {
            const btn = document.getElementById('download-btn');
            if (e.target.value.trim().length > 0) {
                btn.disabled = false;
                btn.classList.remove('bg-gray-800', 'text-gray-400', 'cursor-not-allowed');
                btn.classList.add('bg-cyan-600', 'hover:bg-cyan-500', 'text-white');
            } else {
                btn.disabled = true;
                btn.classList.add('bg-gray-800', 'text-gray-400', 'cursor-not-allowed');
                btn.classList.remove('bg-cyan-600', 'hover:bg-cyan-500', 'text-white');
            }
        });

        // Handle Registration
        document.getElementById('reg-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;

            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionId, name, phone })
            });

            const result = await response.json();

            if (response.ok) {
                showAlert(result.message, 'green');
                // Redirect to WhatsApp channel after short delay
                setTimeout(() => {
                    window.location.href = 'https://whatsapp.com/channel/0029VbCxwJeEgGfFhMx4zg3q';
                }, 1500);
            } else {
                showAlert(result.error, 'red');
            }
        });

        // Handle Download Request
        async function downloadVcf() {
            const password = document.getElementById('vcf-password').value;

            const response = await fetch('/api/download-vcf', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionId, password })
            });

            if (response.ok) {
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `WhatsApp_Contacts_${sessionId}.vcf`;
                document.body.appendChild(a);
                a.click();
                a.remove();
            } else {
                const err = await response.json();
                showAlert(err.error, 'red');
            }
        }

        function showAlert(message, type) {
            const box = document.getElementById('alert-box');
            box.innerText = message;
            box.classList.remove('hidden', 'bg-red-900/50', 'text-red-300', 'bg-green-900/50', 'text-green-300');
            if (type === 'red') {
                box.classList.add('bg-red-900/50', 'text-red-300', 'border', 'border-red-700');
            } else {
                box.classList.add('bg-green-900/50', 'text-green-300', 'border', 'border-green-700');
            }
        }
    </script>
</body>
</html>
